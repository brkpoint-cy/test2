[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "changchun-air-snn"
version = "0.1.0"
description = "Leakage-safe PM2.5 event warning research with LSTM and XGBoost baselines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "xgboost>=2.1",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "PyYAML>=6.0",
  "requests>=2.31",
  "joblib>=1.3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.scripts]
changchun-air = "changchun_air.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
